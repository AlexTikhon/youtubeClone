name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: youtube_clone
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: youtube_clone
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U youtube_clone -d youtube_clone"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://youtube_clone:ci-postgres-password@localhost:5432/youtube_clone?schema=public
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      S3_BUCKET_ORIGINALS: video-originals
      S3_BUCKET_STREAMS: video-streams
      S3_BUCKET_THUMBNAILS: video-thumbnails
      API_PORT: 4000
      WEB_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      SESSION_COOKIE_NAME: ytc_session
      RUN_INTEGRATION_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start MinIO for API integration tests
        run: |
          docker run --detach --name minio-ci \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=ci-access-key \
            --env MINIO_ROOT_PASSWORD=ci-secret-key \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs minio-ci
              exit 1
            fi
            sleep 1
          done
          docker run --rm --network container:minio-ci \
            --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-08-13T08-35-41Z \
            -c 'mc alias set local http://127.0.0.1:9000 ci-access-key ci-secret-key && mc mb --ignore-existing local/video-originals local/video-streams local/video-thumbnails'
      - run: pnpm prisma:migrate:deploy
      - run: pnpm verify
      - run: pnpm --filter @youtube-clone/api test:integration

  browser-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: youtube_clone
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: youtube_clone
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U youtube_clone -d youtube_clone"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://youtube_clone:ci-postgres-password@localhost:5432/youtube_clone?schema=public
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      S3_BUCKET_ORIGINALS: video-originals
      S3_BUCKET_STREAMS: video-streams
      S3_BUCKET_THUMBNAILS: video-thumbnails
      API_PORT: 4000
      WEB_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      SESSION_COOKIE_NAME: ytc_session
      DEV_SEED_PASSWORD: youtube-clone-dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:migrate:deploy
      - run: pnpm prisma:seed
      - run: pnpm --filter @youtube-clone/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
